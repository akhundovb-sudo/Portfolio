                ['D3D3D5', 'B1B2B4', '8D8E91', '6A6B6E', '464749', '28292A', '1B1C1D']

            var FOUR = ['10010', '10010', '10010', '11111', '00010', '00010', '00010'];
            var ZERO = ['01110', '10001', '10001', '10001', '10001', '10001', '01110'];

            if (!grid) return;
            for (var r = 0; r < 7; r++) {
                var row = FOUR[r] + '0' + ZERO[r] + '0' + FOUR[r];
                for (var c = 0; c < 17; c++) {
                    var el = document.createElement('i');
                    el.className = 'nf-cell' + (row[c] === '1' ? ' on' : '');
                    el.style.setProperty('--c', '#' + SCALES[c % 7][r]);
                    el.style.setProperty('--d', (c * 45 + r * 12) + 'ms');
                    grid.appendChild(el);
                }
            }
            // The wave plays once on load; after that each swatch answers on
            // its own: it lifts under the pointer, and a click gives it a new
            // colour from the palette (never the one it has), with a pop.
            grid.classList.add('is-wave');
            setTimeout(function () { grid.classList.remove('is-wave'); }, 450 + 16 * 45 + 6 * 12 + 560);
            // Recolours only use swatches that stand out on the page ground
            // (#F1F1F0): contrast ratio of at least 1.6, so no pale ones.
            function lum(hex) {
                return [0, 2, 4].map(function (i) {
                    var v = parseInt(hex.substr(i, 2), 16) / 255;
                    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
                }).reduce(function (s, v, i) { return s + v * [0.2126, 0.7152, 0.0722][i]; }, 0);

            var ALL = [].concat.apply([], SCALES).filter(function (c) { return (GROUND + 0.05) / (lum(c) + 0.05) >= 1.6; });

                    if (count < GOAL) say(count + ' / ' + GOAL + ' — keep recolouring');

                if (e.target.classList) e.target.classList.remove('is-pop');

    <script>

        // touch screens; Exit or Esc puts the 404 back as it was.
        (function () {
            var COLS = 17, ROWS = 12, EXTRA = ROWS - 7;
            var PIECES = {
                I: [[0,1],[1,1],[2,1],[3,1]], O: [[1,0],[2,0],[1,1],[2,1]],
                T: [[1,0],[0,1],[1,1],[2,1]], S: [[1,0],[2,0],[0,1],[1,1]],
                Z: [[0,0],[1,0],[1,1],[2,1]], J: [[0,0],[0,1],[1,1],[2,1]],
                L: [[2,0],[0,1],[1,1],[2,1]]
            };
            var COLOUR = { I: '11A4F9', O: 'DBAE0E', T: '3D4B68', S: '42AC27', Z: 'FF3F2D', J: '7DAF00', L: '6A6B6E' };
            var digits = document.getElementById('nfDigits'), hint = document.getElementById('nfHint');

                if (!fits(piece.cells, piece.x, piece.y + 1)) { piece = null; over(); return; }
            }
            function fits(cs, x, y) {
                return cs.every(function (p) {
                    var cx = x + p[0], cy = y + p[1];
                    return cx >= 0 && cx < COLS && cy < ROWS && (cy < 0 || !grid[cy][cx]);
                });

            function rotated() {
                if (piece.k === 'O') return piece.cells;
                var size = piece.k === 'I' ? 4 : 3;

                var el = cells[i];
                el.className = 'nf-cell' + (hex ? ' on' : '');

            function draw() {
                for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) paint(r * COLS + c, grid[r][c]);
                if (piece) piece.cells.forEach(function (p) {
                    var y = piece.y + p[1];
                    if (y >= 0) paint(y * COLS + piece.x + p[0], COLOUR[piece.k]);
                });

                piece.cells.forEach(function (p) { var y = piece.y + p[1]; if (y >= 0) grid[y][piece.x + p[0]] = COLOUR[piece.k]; });

                }

                    const n = ac.createBufferSource(); n.buffer = buf;
                    const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = p[1] * 2.2;
                    const g = ac.createGain(); g.gain.value = p[2];
                    n.connect(f).connect(g).connect(ac.destination); n.start(t);
                    // A small body under the click, so it sounds like plastic, not static.
                    const o = ac.createOscillator(), og = ac.createGain();
                    o.frequency.setValueAtTime(p[1], t); o.frequency.exponentialRampToValueAtTime(p[1] * 0.6, t + 0.05);
                    og.gain.setValueAtTime(p[2] * 0.5, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
                    o.connect(og).connect(ac.destination); o.start(t); o.stop(t + 0.08);
                });
            }

            function frame(i) {
                const reel = hall.querySelector('.ab-cinema-reel');
                // On phones the why sits above the screen instead of on the still.
                const cap = hall.querySelector('.ab-cinema-caption');
                cap.textContent = i < FILMS.length ? FILMS[i][2] : '';
                if (i >= FILMS.length) {
                    reel.innerHTML = '<span class="ab-cinema-end">The End</span>';
                reel.classList.add('is-end');
                } else {
                    const f = FILMS[i];
                    reel.innerHTML =
                        '<img class="ab-cinema-still" src="/images/films/' + f[3] + '.jpg" alt="' + f[0] + ', a still">' +
                        '<span class="ab-cinema-no">My top ' + FILMS.length + ' · ' + (i + 1) + ' / ' + FILMS.length + '</span>' +
                        '<span class="ab-cinema-text">' +
                            '<span class="ab-cinema-title">' + f[0] + ' <span class="ab-cinema-year">' + f[1] + '</span></span>' +
                            '<span class="ab-cinema-why">' + f[2] + '</span>' +
                        '</span>' +
                        '<span class="ab-cinema-credit">© ' + f[4] + '</span>';
                }
                // A splice: a quick white flicker as the next reel comes in.
                hall.classList.remove('is-cut'); void hall.offsetWidth; hall.classList.add('is-cut');
            }

            function hint(t) { const h = hall && hall.querySelector('.ab-cinema-hint'); if (h) h.textContent = t; }

            function next() {
                if (!hall || busy) return;
                if (at >= FILMS.length) { leave(); return; }
                at++;
                flick();
                frame(at);
                if (at === FILMS.length) {
                    // The End: the curtain closes over it, then the lights come up.
                    busy = true;
                    hint('');
                    setTimeout(function () { hall && hall.classList.remove('is-open'); }, 1400);
                    setTimeout(function () { busy = false; leave(); }, 3200);
                } else {
                    const verb = matchMedia('(hover: none)').matches ? 'Tap' : 'Click';
                    hint(verb + (at === FILMS.length - 1 ? ' for the ending' : ' for the next film'));
                }
            }

            function come() {
                if (hall) { leave(); return; }
                at = -1; busy = false;
                // Load the stills now so each reel comes in whole.
                FILMS.forEach(function (f) { new Image().src = 'images/films/' + f[3] + '.jpg'; });
                veil = document.createElement('div');
                veil.className = 'ab-veil ab-veil--dark';
                veil.addEventListener('click', leave);
                hall = document.createElement('div');
                hall.className = 'ab-cinema';
                hall.innerHTML =
                    '<button type="button" class="ab-cinema-close" aria-label="Close"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2L12 12M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>' +
                    '<span class="ab-cinema-caption" aria-hidden="true"></span>' +
                    '<button type="button" class="ab-cinema-stage" aria-label="Next film">' +
                        '<span class="ab-cinema-screen"><span class="ab-cinema-reel" aria-live="polite"></span><i class="ab-cinema-grain" aria-hidden="true"></i></span>' +
                        '<i class="ab-cinema-curtain ab-cinema-curtain--l" aria-hidden="true"></i>' +
                        '<i class="ab-cinema-curtain ab-cinema-curtain--r" aria-hidden="true"></i>' +
                        '<i class="ab-cinema-valance" aria-hidden="true"></i>' +
                    '</button>' +
                    '<span class="ab-cinema-hint"></span>';
                document.body.append(veil, hall);
                hall.querySelector('.ab-cinema-close').addEventListener('click', leave);
                hall.querySelector('.ab-cinema-stage').addEventListener('click', next);
                requestAnimationFrame(function () { requestAnimationFrame(function () {
                    veil && veil.classList.add('is-on');
                    hall && hall.classList.add('is-on');
                }); });
                // Lights down, then the curtain parts on the first film.
                setTimeout(function () {
                    if (!hall) return;
                    next();
                    hall.classList.add('is-open');
                }, 700);
            }

            function leave() {
                if (!hall) return;
                const h = hall, v = veil; hall = veil = null;
                h.classList.remove('is-on');
                v.classList.remove('is-on');
                setTimeout(function () { h.remove(); v.remove(); }, 500);
            }

            trigger.addEventListener('click', function () {
                document.dispatchEvent(new CustomEvent('ab-egg', { detail: 'cinema' }));
                come();
            });
            document.addEventListener('ab-egg', function (e) { if (e.detail !== 'cinema') leave(); });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') leave(); });
        })();

        // Hobbies easter egg: "photography" turns the pointer into a
        // viewfinder. A click takes a shot: a flash, a shutter, and a print
        // of one of my nature shots (images/desk/) comes out of the frame,
        // developing as it flies down to the footer, where the prints stay in
        // a row on its edge. On a phone a tap shoots where it lands. The
        // cross, Esc or the word again put the camera away.
        (function () {
            const trigger = document.querySelector('.ab-photo-trigger');
            if (!trigger) return;
            // Nature only: the cliff stairs, the storm, Kolsai lake, Charyn
            // canyon, the beach and the monkey.
            const NATURE = ['18', '17', '13', '14', '09', '04'];
            let on = false, vf = null, close = null, ac = null, x = 0, y = 0, next = 0;

            function shutter() {
                if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
                try {
                    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
                    if (ac.state === 'suspended') ac.resume();
                } catch (e) { return; }
                // Two short clicks: the curtain opens and closes.
                [0, 0.07].forEach(function (dt, i) {
                    const len = 0.03, buf = ac.createBuffer(1, ac.sampleRate * len, ac.sampleRate), d = buf.getChannelData(0);
                    for (let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / d.length, 3);
                    const n = ac.createBufferSource(); n.buffer = buf;
                    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = i ? 2600 : 3800; f.Q.value = 1.5;
                    const g = ac.createGain(); g.gain.value = i ? 0.28 : 0.2;
                    n.connect(f).connect(g).connect(ac.destination); n.start(ac.currentTime + dt);
                });
            }

            function size() {
                return window.innerWidth <= 768 ? { w: 168, h: 120 } : { w: 240, h: 168 };
            }

            function place(px, py) {
                const z = size();
                x = Math.max(z.w / 2, Math.min(window.innerWidth - z.w / 2, px));
                y = Math.max(z.h / 2, Math.min(window.innerHeight - z.h / 2, py));
                vf.style.transform = 'translate(' + (x - z.w / 2) + 'px,' + (y - z.h / 2) + 'px)';
            }

            // The row of prints on the footer's top edge, made on first use.
            function shelf() {
                let p = document.querySelector('.ab-shelf');
                if (!p) {
                    p = document.createElement('div');
                    p.className = 'ab-shelf';
                    p.setAttribute('aria-hidden', 'true');
                    document.querySelector('.footer').appendChild(p);
                }
                return p;
            }

            function shoot() {
                const z = size(), fx = x - z.w / 2, fy = y - z.h / 2;
                shutter();
                vf.classList.remove('is-flash'); void vf.offsetWidth; vf.classList.add('is-flash');

                const pile = shelf();
                const n = NATURE[next % NATURE.length];
                const slot = next % NATURE.length;
                next++;
                // Six places on the shelf; a new shot of the same place
                // replaces the old print there.
                const was = pile.querySelector('[data-slot="' + slot + '"]');
                if (was) was.remove();

                const print = document.createElement('div');
                print.className = 'ab-print';
                print.dataset.slot = slot;
                print.innerHTML = '<span class="ab-print-shot"><img src="/images/desk/' + n + '.jpg" alt="" decoding="async"></span>';
                const rot = ((slot % 2 ? 1 : -1) * (3 + Math.random() * 6)).toFixed(1) + 'deg';
                print.style.setProperty('--rot', rot);
                print.style.left = (slot * 64) + 'px';
                pile.appendChild(print);

                // Fly from the frame to its place: measure where it will
                // rest, then play the way there backwards from the frame.
                const to = print.getBoundingClientRect();
                const k = z.w / to.width;
                const dx = fx - to.left, dy = fy - to.top;
                print.animate([
                    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + k + ') rotate(0deg)', offset: 0 },
                    { transform: 'translate(' + dx + 'px,' + (dy - 12) + 'px) scale(' + k * 1.04 + ') rotate(0deg)', offset: 0.15 },
                    { transform: 'rotate(' + rot + ')', offset: 1 }
                ], { duration: 1100, easing: 'cubic-bezier(0.65, 0, 0.35, 1)' });
            }

            // While the camera is out, clicks take photos instead of following links.
            function onClick(e) {
                if (!on) return;
                if (e.target.closest('.ab-vf-close')) return;
                e.preventDefault();
                e.stopPropagation();
                if (e.target.closest('.ab-photo-trigger')) { stop(); return; }
                place(e.clientX, e.clientY);
                shoot();
            }
            function onMove(e) { if (on && e.pointerType !== 'touch') place(e.clientX, e.clientY); }
            function onKey(e) { if (on && e.key === 'Escape') stop(); }

            function start() {
                if (on) { stop(); return; }
                on = true;
                document.documentElement.classList.add('ab-vf-on');
                vf = document.createElement('div');
                vf.className = 'ab-vf';
                vf.setAttribute('aria-hidden', 'true');
                vf.innerHTML = '<i></i><i></i><i></i><i></i><b></b><span class="ab-vf-meta">1/125 · f/2.8 · ISO 400</span><span class="ab-vf-flash"></span>';
                const z = size();
                vf.style.width = z.w + 'px';
                vf.style.height = z.h + 'px';
                close = document.createElement('div');
                close.className = 'ab-vf-bar';
                close.innerHTML = '<span class="ab-vf-hint">' + (matchMedia('(hover: none)').matches ? 'Tap to take a photo' : 'Click to take a photo') + '</span>' +
                    '<button type="button" class="ab-vf-close" aria-label="Put the camera away"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2L12 12M12 2L2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>';
                document.body.append(vf, close);
                close.querySelector('.ab-vf-close').addEventListener('click', stop);
                const r = trigger.getBoundingClientRect();
                place(r.left + r.width / 2, r.top - z.h / 2 - 12);
                requestAnimationFrame(function () { vf && vf.classList.add('is-on'); close && close.classList.add('is-on'); });
                document.addEventListener('click', onClick, true);
                document.addEventListener('pointermove', onMove, { passive: true });
                document.addEventListener('keydown', onKey);
            }

            function stop() {
                if (!on) return;
                on = false;
                document.documentElement.classList.remove('ab-vf-on');
                document.removeEventListener('click', onClick, true);
                document.removeEventListener('pointermove', onMove);
                document.removeEventListener('keydown', onKey);
                const gone = [vf, close];
                vf = close = null;
                gone.forEach(function (el) { el.style.transition = 'opacity 300ms ease'; el.style.opacity = '0'; });
                setTimeout(function () { gone.forEach(function (el) { el.remove(); }); }, 320);
            }

            trigger.addEventListener('click', function () {
                if (on) return; // handled by onClick
                document.dispatchEvent(new CustomEvent('ab-egg', { detail: 'photo' }));
                start();
            });
            document.addEventListener('ab-egg', function (e) { if (e.detail !== 'photo') stop(); });
        })();

        // The image can finish loading before this script defines
        // hideSkeleton, so its onload misses; catch that case here.
        (function () {
            const image = document.getElementById('profileImage');
            if (image && image.complete && image.naturalWidth) hideSkeleton();
        })();

        // Fallback: hide skeleton after 3 seconds if image doesn't load
        setTimeout(() => {
            const skeleton = document.getElementById('skeletonLoader');
            const image = document.getElementById('profileImage');
            
            if (skeleton && image && image.style.display === 'none') {
                skeleton.style.display = 'none';
                image.style.display = 'block';
            }
        }, 3000);
    </script>
</body>

</html>
